# HTTPS terminates at Cloudflare. Normalize absolute HTTPS Destination headers
# before the plain-HTTP DAV engine, which otherwise rejects COPY and MOVE.
map $http_destination $webdav_destination {
    default $http_destination;
    ~*^https://dav[.]labulubius[.]com(?::443)?(?<webdav_destination_path>/.*)$ http://dav.labulubius.com$webdav_destination_path;
}

server {
    listen 127.0.0.1:8081;
    server_name dav.labulubius.com;
    absolute_redirect off;
    access_log off;
    client_max_body_size 95m;
    client_body_timeout 120s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Destination $webdav_destination;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect http://dav.labulubius.com/ https://dav.labulubius.com/;
        proxy_redirect http://dav.labulubius.com:8084/ https://dav.labulubius.com/;
    }
}

server {
    listen 127.0.0.1:8084;
    server_name dav.labulubius.com;
    root /srv/webdav-data;
    absolute_redirect off;
    access_log off;
    client_max_body_size 95m;
    client_body_timeout 120s;

    location = /_zotero_auth {
        internal;
        proxy_pass http://127.0.0.1:8082/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        auth_request /_zotero_auth;
        # Accept clients that omit the trailing slash when creating a folder.
        if ($request_method = MKCOL) {
            rewrite ^(.*[^/])$ $1/ break;
        }
        dav_methods PUT DELETE MKCOL COPY MOVE;
        dav_ext_methods PROPFIND OPTIONS;
        dav_access user:rw group:rw;
        create_full_put_path off;
        autoindex off;
    }
}
