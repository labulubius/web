# Public backend adapter. Native CloudCLI auth remains enabled on every protected route.
map $http_upgrade $cloudcli_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:30144;
    server_name cloudcli.labulubius.com;
    access_log off;
    # Native SSE/WebSocket URLs can contain access tokens: never log request URLs.
    error_log /dev/null crit;
    client_max_body_size 50m;

    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "private, no-store" always;
    add_header Content-Security-Policy "frame-ancestors https://labulubius.com" always;
    add_header X-Content-Type-Options nosniff always;

    # Single-user setup is performed through the private SSH-forwarded listener.
    # Block registration on the public adapter, including case/trailing-slash variants.
    location ~* ^/api/auth/register(?:/|$) {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:30143;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cloudcli_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
